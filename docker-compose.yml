services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: signalops
      POSTGRES_PASSWORD: signalops
      POSTGRES_DB: signalops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Async ingestion worker: reads the Redis Stream and bulk-indexes into OpenSearch.
  # Scale with `docker compose up --scale consumer=3` (consumer group load-balances).
  consumer:
    image: python:3.11-slim
    container_name: signalops-consumer
    working_dir: /app
    volumes:
      - ./backend:/app
    command: >
      sh -c "pip install -q redis opensearch-py && python -m app.consumer"
    environment:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - opensearch
      - redis

volumes:
  postgres_data:

