[tool.poetry]
name = "signalops-backend"
version = "0.1.0"
description = "FastAPI backend for SignalOps observability project"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
opensearch-py = "^2.7.1"
python-dotenv = "^1.0.1"
pydantic = "^2.9.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

