[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-report=xml
markers =
    integration: tests that require live OpenSearch/Postgres testcontainers
    unit: pure-Python tests with no external services
