AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SignalOps serverless log ingestion.
  API Gateway (HTTP API) -> Lambda -> Redis Stream. The existing consumer
  (app/consumer.py) drains the stream into OpenSearch.

Parameters:
  RedisHost:
    Type: String
    Description: Redis endpoint (managed public endpoint, or in-VPC ElastiCache).
  RedisPort:
    Type: String
    Default: "6379"
  RedisPassword:
    Type: String
    Default: ""
    NoEcho: true
    Description: Redis password (leave blank for no-auth ElastiCache).
  RedisSsl:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set true for TLS endpoints (e.g. Upstash).
  SubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Private subnets (only needed for in-VPC ElastiCache; leave blank for a public Redis).
  SecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Security groups allowing egress to Redis (only for the VPC path).

Conditions:
  # Attach a VpcConfig only when subnets are provided (the ElastiCache path).
  UseVpc: !Not [!Equals [!Join ["", !Ref SubnetIds], ""]]

Globals:
  Function:
    Runtime: python3.11
    Timeout: 10
    MemorySize: 256

Resources:
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      # CodeUri is relative to this template (backend/serverless -> backend/lambdas).
      CodeUri: ../lambdas
      Handler: ingest_handler.handler
      Environment:
        Variables:
          REDIS_HOST: !Ref RedisHost
          REDIS_PORT: !Ref RedisPort
          REDIS_PASSWORD: !Ref RedisPassword
          REDIS_SSL: !Ref RedisSsl
          LOG_STREAM: "logs:stream"
          LOG_STREAM_MAXLEN: "1000000"
      VpcConfig: !If
        - UseVpc
        - SubnetIds: !Ref SubnetIds
          SecurityGroupIds: !Ref SecurityGroupIds
        - !Ref AWS::NoValue
      Events:
        Ingest:
          Type: HttpApi
          Properties:
            Path: /logs/ingest
            Method: POST

Outputs:
  IngestApiUrl:
    Description: POST endpoint for serverless log ingestion.
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/logs/ingest"
